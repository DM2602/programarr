services:
  programarr:
    build: .
    image: programarr:local
    container_name: programarr
    restart: unless-stopped
    ports:
      - "${PROGRAMARR_PORT:-8796}:8000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=${UMASK:-002}
      - TZ=${TZ:-Europe/Zurich}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - PROGRAMARR_LOG_LEVEL=${PROGRAMARR_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      # Media folders, writable. Change the left side; the right side is up to you.
      # If Plex sees them under another path, map it under Settings › Plex.
      - ${MEDIA_PATH:-/mnt/media}:/media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: programarr-flaresolverr
    restart: unless-stopped
    profiles: ["solver"]
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Zurich}
